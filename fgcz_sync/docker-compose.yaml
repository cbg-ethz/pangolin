services:
  fgcz_sync: # Service name (container that will be created) - no container neame specified here
    build:
      context: /data/projects/fgcz_data_sync_automation/pangolin 
    volumes: #directories of the wisedb VM
      - /data/projects/fgcz_data_sync_automation/workdir:/app/workdir:rw
    secrets:
      - bs-pangolin_login_euler
      - bs-pangolin_login_backups
      - fgcz_login
      - id_ed25519_fgcz_sync
      - rsync.pass.euler
secrets:
  bs-pangolin_login_euler:
    file: /data/projects/fgcz_data_sync_automation/secrets/bs-pangolin@euler.ethz.ch
  bs-pangolin_login_backups:
    file: /data/projects/fgcz_data_sync_automation/secrets/bs-pangolin@d@bs-bewi08
  fgcz_login:
    file: /data/projects/fgcz_data_sync_automation/secrets/fgcz-gstore.uzh.ch
  id_ed25519_fgcz_sync:
    file: /data/projects/fgcz_data_sync_automation/secrets/id_ed25519_fgcz_sync # wisedb to connect to euler
  rsync.pass.euler:
    file: /data/projects/fgcz_data_sync_automation/secrets/rsync.pass.euler #rsync deamon running in background of euler