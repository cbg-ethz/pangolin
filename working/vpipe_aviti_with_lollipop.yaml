general:
    aligner: bwa
    primers_trimmer: samtools
    threads: 6
    #temp_prefix: xxx
    preprocessor: skip


input:
    datadir: vpipe_output
    samples_file: /cluster/project/pangolin/processes/sars_cov_2/working/samples_aviti.tsv_six_months_ago.tsv
    metainfo_file: /cluster/project/pangolin/processes/sars_cov_2/pangolin/working/references/metainfo.yaml
    gff_directory: /cluster/project/pangolin/processes/sars_cov_2/pangolin/working/references/gffs/
    protocols_file: /cluster/project/pangolin/processes/sars_cov_2/pangolin/working/references/primers.yaml
    genes_gff: /cluster/project/pangolin/processes/sars_cov_2/pangolin/working/references/gffs/Genes_NC_045512.2.GFF3
    variants_def_directory: /cluster/project/pangolin/processes/sars_cov_2/pangolin/working/references/voc/
    
    # doesn't need to defie as it is defined in vpipe.conf fall back conf: reference: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/NC_045512.2.fasta
    #TODO: check these files if they are the same btween this and the above and/ or copy them
    # same as above: metainfo_file: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/metainfo.yaml
    # same as above: gff_directory: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/gffs/
    # same as abovegenes_gff: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/gffs/Genes_NC_045512.2.GFF3
    # check if this is the correct primer primers_file: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/primers/v3/nCoV-2019.tsv
    # probably not needed to define here: primers_bedfile: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/primers/v3/nCoV-2019.primer.bed
    # old file: protocols_file: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/primers.yaml
    # copied to des above: variants_def_directory: /cluster/project/pangolin/processes/sars_cov_2/lollipop/references/voc/

    
output:
    datadir: /cluster/project/pangolin/processes/sars_cov_2/vpipe_output/ # i checked, lollipop bring results function copies results from here, so this is the correct datadir (the one we artificially replicated for the extra lollipop step)
    cohortdir: /cluster/project/pangolin/processes/sars_cov_2/vpipe_output/variants/
    trim_primers: True
    snv: True #adapted
    local: True #adapted
    global: False
    visualization: True
    QA: True
    dehumanized_raw_reads: True
    upload: True
    
gunzip:
    mem: 100000
    
extract:
    mem: 100000
    
preprocessing:
    mem: 10000
    
sam2bam:
    mem: 5000
    
ref_bwa_index:
    mem: 65536
    
bwa_align:
    mem: 40690
    threads: 8
    # linear scale breaks at 8~16 (See: https://www.researchgate.net/figure/Performance-of-Multi-Threading-CPU-time-and-walltime-usage-of-BWA-Mem-and-GATK_fig3_275950273)
    #  2: 2739, 4: 5012, 6: 6045, 8: 6404 /8995
    
bowtie_align:
    mem: 12288
    threads: 6
    
    
hmm_align:
    leave_msa_temp: true
    
timeline:
    locations_table: ww_locations.tsv
    regex_yaml: regex.yaml
    
deconvolution:
    threads: 16
    deconvolution_config: deconv_bootstrap_cowwid.yaml # deconv_mcgill.yaml # FOLLOWUP: does not exist in ../../lollipop/deconv_mcgill.yaml
    variants_config: variant_config.yaml
    variants_dates: var_dates.yaml
    out_format: columns 
    
frameshift_deletions_checks:
    mem: 8192
    
coverage:
    mem: 131072
    threads: 32
    time: 60
    
minor_variants:
    mem: 16384
    threads: 64
    
upload:
    consensus: majority
    options: -R
    orig_fastq: false
    orig_cram: True
    
dehuman:
    mem: 34000
    threads: 4
    time: 280
    keep_host: True
    catchup: False
    
web_visualization:
    mem: 2000
    
coverage_intervals:
    coverage: 0
    mem: 2000
    threads: 1
    
lofreq:
    consensus: false
    
snv:
    consensus: false
    localscratch: $TMPDIR
    ### NOTE the next three parameters are going to be edited by a sed script
    # as follows:    time    meme    threads
    # - normal:    240    1024    64
    # - hugemem:    1200    32768    63
    time: 2400
    mem: 4096
    threads: 64

covvfit:
    # this one is hard-linked from:
    # /cluster/project/pangolin/resources/cowwid/covvfit/analysis/lollipop/config/deconv_config.yaml
    # it's *NON*-smoothed
    deconvolution_config: deconv_config_nosmooth.yaml
    # rest of covvfit's deconvolution is shared with usual deconvolution
    # -
    # this one is hard-linked from:
    # /cluster/project/pangolin/resources/cowwid/covvfit/analysis/lollipop/config/deconv_config.yaml
    # its the main varians + figure output parameters
    config: covvfit_config.yaml
    # -
    # these are copied from:
    # /cluster/project/pangolin/resources/cowwid/covvfit/analysis/covvfit_analysis/scripts/run_covvfit.sh
    # they should already be the default
    max_days: 180
    horizon: 90
