services:
  pangolin:
    build:
      context: /data/projects/wastewater_automation_new/pangolin 
    volumes:
      - /data/projects/wastewater_automation_new/workdir:/app/workdir:rw
      - /data/projects/wastewater_automation_new/resources:/app/resources:ro
      - /data/projects/dataset:/app/dataset:rw
      - /data/projects/wastewater_automation_new/pangolin:/app/codebase:ro
      - /raw_data:/app/raw_data:rw
    secrets:
      - bs-pangolin_login_euler
      - bs-pangolin_login_backups
      - fgcz_login
      - id_ed25519_wisedb
      - id_ed25519_wisedb_backups
      - rsync.pass.euler
      - spsp_gpg_key
      - bs_pangolin_gpg_key
      - bs_pangolin_gpg_key_password
      - sendcrypt_profile
      - spsp_uploads_ssh_private_key
      - wisedb_token
