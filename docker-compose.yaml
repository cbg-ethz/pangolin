      - /data/projects/rsv_automation_restructuring/resources:/app/resources:ro
      - /data/projects/dataset:/app/dataset:rw
      - /data/projects/rsv_automation_restructuring/pangolin:/app/codebase:ro
    secrets:
      - bs-pangolin_login_euler
      - bs-pangolin_login_backups
      - fgcz_login
      - id_ed25519_rsv
      - id_ed25519_rsv_backups
      - rsync.pass.euler
      - spsp_gpg_key
      - bs_pangolin_gpg_key
      - bs_pangolin_gpg_key_password
      - sendcrypt_profile
      - spsp_uploads_ssh_private_key
