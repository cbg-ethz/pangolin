services:
  pangolin_influenza:
    build:
      context: /data/projects/influenza_automation/pangolin 
    volumes:
      - /data/projects/influenza_automation/workdir:/app/workdir:rw
      - /data/projects/influenza_automation/resources:/app/resources:ro
      - /data/projects/dataset:/app/dataset:rw
      - /data/projects/influenza_automation/pangolin:/app/codebase:ro
    secrets:
      - bs-pangolin_login_euler
      - bs-pangolin_login_backups
      - fgcz_login
      - id_ed25519_influenza
      - id_ed25519_influenza_backups
      - rsync.pass.euler
      - spsp_gpg_key
      - bs_pangolin_gpg_key
      - bs_pangolin_gpg_key_password
      - sendcrypt_profile
      - spsp_uploads_ssh_private_key
secrets:
  bs-pangolin_login_euler:
    file: /data/projects/influenza_automation/secrets/bs-pangolin@euler.ethz.ch
  bs-pangolin_login_backups:
    file: /data/projects/influenza_automation/secrets/bs-pangolin@d@bs-bewi08
  fgcz_login:
    file: /data/projects/influenza_automation/secrets/fgcz-gstore.uzh.ch
  id_ed25519_influenza:
    file: /data/projects/influenza_automation/secrets/id_ed25519_influenza
  id_ed25519_influenza_backups:
    file: /data/projects/influenza_automation/secrets/id_ed25519_influenza_backups
  rsync.pass.euler:
