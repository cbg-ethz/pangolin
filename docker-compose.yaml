  spsp_uploads_ssh_private_key:
    file: /data/projects/influenza_automation/secrets/id_ed25519_spsp_uploads
  spsp_gpg_key:
    file: /data/projects/influenza_automation/secrets/ABC9FC14AAC952E7767FD14A48B70E724BAFE0A3.asc
  bs_pangolin_gpg_key:
