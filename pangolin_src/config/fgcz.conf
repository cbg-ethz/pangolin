[ _ ]
# lab's name for the batch YAML description
lab=fgcz
# name of the _SFTP_ server, as used when fetching data files (i.e.: same name as in netrc file)
fileserver=fgcz-gstore.uzh.ch
# port used by SFTP, in case of non standard (you can also use ~/.ssh/config for that)
srvport_sftp=666
srvport_https=443
protocol=sftp
# experiment name in sftp store
expname=/projects
projlist=( 'p23224' )
# directory to hold the unsorted downloaded datasets
download=/cluster/project/pangolin/data/fgcz_raw
## sub-directory to hold the sorted samples set
#sampleset=staging-fcgz
sampleset=/cluster/project/pangolin/processes/influenza/vpipe_input
## Subdirectory in sampleset storing the raw data
rawdir=raw_data
## Subdirectory in sampleset storing the extracted data
extracteddir=extracted_data
# explicit list of orders spread among multiple batches that should be merged
fuselist=
# delay after which orders aren't considered for merging anymore
fusedays=9
nofuselist=
## linking instead of copying ?
##  --reflink for CoW filesystems (ZFS, BTRFS)
##  --hardlink for most unix-like filesystems
link=--link
# parallel copy jobs (default: 16)
parallel=8
# SSH connection timeout (default: 300)
contimeout=300
# IO timeout (default: 300)
iotimeout=300
# number of attempts to reconnect (Default: 10)
#retries=10
# mark bad runs
badlist=o37902_Aviti_250307_AV086,o38285_Aviti_250417_AV093,o40173_Aviti_251031_AV130,o40262_Aviti_251114_AV133,o39908_Aviti_251003_AV123,o40029_Aviti_251017_AV129,o40139_Aviti_251031_AV131,o38513_Aviti_250516_AV096,o38697_Aviti_250530_AV098,o38832_Aviti_250613_AV101,o38965_Aviti_250630_AV103,o38965_Aviti_250701_AV104,o39115_Aviti_250711_AV105,o39115_Aviti_250722_AV108,o39253_Aviti_250724_AV110,o39518_Aviti_250822_AV111,o39684_Aviti_250905_AV115,o39798_Aviti_250919_AV117,o39908_Aviti_251003_AV123,o40029_Aviti_251017_AV129,o40173_Aviti_251031_AV130,o40139_Aviti_251031_AV131,o40262_Aviti_251114_AV133,o30556_NextSeq_250516_NS2k-503,o40457_Aviti_251212_AV140
forcelist=
# if libkit isn't mentionned, set protocol to this:
fallbackproto=v3
# do we download patchmap lists from google sheet?
google_sheet_patches=0
