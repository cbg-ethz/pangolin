[ _ ]
# labs: SFTP synchronisation
# (except in case of abnormally slow operation, sync can be left active)
skipsync='fgcz'
# labs: sample sorting and import
# (set to 0 for labs whose sequences we aren't currently importing, e.g. due to problems)
declare -A lab
lab=( ['gfb']=0 ['fgcz']=1 ['h2030']=0 ['viollier']=0 )
# NOTE: h2030 isn't sequencing as the number of cases is lower.
# pass '--force' to force overwriting any existing file when moving
sort_force=--force
# base wastewater dir
wwdir=/app
# base directory
basedir=${wwdir}/workdir
# sub-directory of openbis download for rights fixing
download=openbis-downloads
# sub-directory containing the scripts
scriptdir=${wwdir}/pangolin_src
# directory containing the entire git repository, for logging purposes
codebase=${wwdir}/codebase
# directory where the sampleset batchfiles are stored on the VM
batchfiles_dir=${basedir}/tmp/belfrybatch
# sub-directory to hold the sorted samples set
# working sub-directory
# linking instead of copying ?
#  --reflink for CoW filesystems (ZFS, BTRFS)
#  --hardlink for most unix-like filesystems
link=--link
# Installation directory of miniconda3
baseconda=${wwdir}/miniconda3
# File containing the Rsync password
rsync_pass=/home/bs-pangolin/.ssh/rsync.pass.euler
# YAML file containing the primers
protocolyaml=references/artic_primers_versions.yaml
# Regular expression to recognize sample names
rxsample='(^[[:digit:]]{6,}_)|(^[[:digit:]]{8,})|(^Y[[:digit:]]{8,})|([[:digit:]]{2}_20[[:digit:]]{2}_[01]?[[:digit:]]_[0-3]?[[:digit:]])|(^KLZHC[oO][vV])|(^B[aA][[:digit:]]{4,})|(^USB_20[[:digit:]]{2}_[01]?[[:digit:]]_[[:digit:]]{2}_.{8})'
# Date after which all samples are processed as Aviti
aviti_date=20240801
# Flag to temporary skip Aviti in case the sequencing center reverts back to Illumina
skipaviti=0

# group on the storage/euler (inside data/fgcz_raw)
# storgrp=bsse-covid19-pangolin@d.ethz.ch
storgrp=bs-pangolin
# parallel copy jobs
parallel=8
# parallel backup copy jobs
parallelpull=4
# timeout before rsync considers the transfer failed in seconds
rsynctimeout=2000
# SSH connection timeout
contimeout=300
# IO timeout
iotimeout=300
# suspend jobs submission in case of problems
donotsubmit=0
# skip or run ShoRAH step of V-pipe
run_shorah=0
# mail
mailfrom='Automation-carillon<bs-pangolin@ethz.ch>'
mailto=
# timeout for the whole automation loop
runtimeout=7200
# timeout to wait for 'sync' command: 0: no timeout, "": default, otherwise seconds
synctimeout=0
# directory containing the local copy of the dataset
local_dataset=/app/raw_data

# Cluster config
# username used on the cluster (while we're switching over)
cluster_user=bs-pangolin
cluster=euler.ethz.ch
clusterdir_old="/cluster/project/pangolin"
clusterdir="processes/rsv"
sourcefiles_location="pangolin/pangolin_src"
working_vpipe="pangolin/working_vpipe"
working="working"
sampleset="vpipe_input"
configfile="vpipe_rsva_aviti.yaml"
filter_samplelist_by_date=1
# rsyncd module to sync from the remote status folder
remote_status_rsv=remote_status_rsv
# rsyncd module to sync from the remote bfabric sync folder
bfabric_downloads="data/fgcz_raw"
# Directory containing the git repository of V-pipe
vpipe_code=${clusterdir_old}/processes/V-pipe

# BSSE folder backups config
# Do we want to backup the Vpipe results?
backup_vpipe=0
# Do we want to backup the VILOCA results?
backup_viloca=0
# Do we want to backup the uploader results?
backup_uploader=0
# Do we want to backup the FGCZ mirror?
backup_fgcz_raw=1
# Do we want to backup the amplicon coverage results?
backup_amplicon_cov=0
# the user of the remote machine used for backup
bck_user=bs-pangolin
# the hostname of the remote machine used for backup
bckhost=d@bs-bewi08
# Remote directory for the uploader results
remote_uploader_backup_dir=/links/shared/covid19-pangolin/backup/rsv_results/pangolin

# Downstream analysis-specific configuration
run_downstream=1
downstream_analysis_dir=${clusterdir_old}/${clusterdir}/rsv_downstream_analysis
rsv_git_repo_folder=${downstream_analysis_dir}/RSV-wastewater-V-pipe/regular_monitoring_2024_2025/

# Status tracking configuration
statusdir=${basedir}/status
viloca_statusdir=${statusdir}/viloca
uploader_statusdir=${statusdir}/uploader
lockfile=${statusdir}/carillon_lock
# statusfile containing the number of uploaded files for the day
uploader_number_status=${uploader_statusdir}/uploader_number
amplicon_coverage_statusdir=${statusdir}/amplicon_coverage
downstream_analysis_statusdir=${statusdir}/downstream_analysis
# Location of the token to connect to wisedb
wisedb_token=/home/bs-pangolin/.ssh/wisedb_token.txt


# RSVA-specific matches for filtering the sample list
rsva_match="sequencing of both RSV-A and B|RSV subtype A and B|RSV subtype A|RSV-A and B|RSV A and B|v3|v532|RSV_pooled|SARS-Cov2 Artic, RSV, Influenza Library Consumables Bioconcept Panel|Amplicon Barcoding|RSV_pooled_old|SARS-CoV-2 ARTIC V5.3.2 NEB Ultra II|test|RSV-A|RSVA|rsva|rsv-a|RSV subtype A and B|RSV subtype A|RSV Subtype A and B|v532_pooled"
rsva_genbank_file="${clusterdir_old}/${clusterdir}/working/references/EPI_ISL_412866_hRSV_A_England_397_2017.gb"
# RSVB-specific matches for filtering the sample list
rsvb_match="sequencing of both RSV-A and B|RSV subtype A and B|RSV subtype B|RSV-A and B|RSV A and B|v3|v532|RSV_pooled|SARS-Cov2 Artic, RSV, Influenza Library Consumables Bioconcept Panel|Amplicon Barcoding|RSV_pooled_old|SARS-CoV-2 ARTIC V5.3.2 NEB Ultra II|test|RSV-B|RSVB|rsvb|rsv-b|RSV subtype A and B|RSV subtype B|RSV Subtype A and B|v532_pooled"
rsv_startdate=20241122
rsvb_genbank_file="${clusterdir_old}/${clusterdir}/working/references/EPI_ISL_1653999_hRSV_B_Australia_VIC-RCH056_2019.gb"
