  - conda-forge
  - bioconda
  - defaults
  - anaconda
dependencies:
  - r=4.4
  - r-base=4.4
  - r-optparse=1.7
  - r-data.table=1.15
  - r-yaml=2.3
  - r-tidyverse=2.0
  - bioconductor-biostrings=2.74
